name: Publish package index (Pages)

# Owns the single GitHub Pages deployment. Builds, once per supported CUDA
# version:
#   * stable-ABI operator libraries (.so)         -> ops/<pkgver>/<cuXXX>/
#   * per-CUDA wheels that bundle those kernels    -> whl/<cuXXX>/ (PEP 503)
# and deploys both (plus a landing page) in a single Pages publish. Because the
# kernels use the Torch Stable ABI, one build per CUDA version works across
# every Python/PyTorch version, so the matrix is CUDA-only.
#
# Pages allows only one deployment per site, so ops + wheels must be
# assembled and deployed by this single workflow. PyPI publishing of the
# generic wheel/sdist lives separately in release.yml.
#
# Manual only: each per-CUDA build compiles the kernels for every supported
# GPU architecture, about an hour per CUDA version without a warm binary
# cache. Run via workflow_dispatch when a release needs fresh kernels.

on:
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-ops:
    name: Build ops (${{ matrix.cuda }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cuda: [cu126, cu128, cu129, cu130, cu132, cu134]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Free runner disk space
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc

      - name: Install Determinate Nix
        uses: DeterminateSystems/determinate-nix-action@021c8a1bd3570eb21f5c20a054812b0c4d9ca614 # v3.22.3
        with:
          extra-conf: |
            extra-substituters = https://cache.nixos-cuda.org https://nix-community.cachix.org
            extra-trusted-public-keys = cache.nixos-cuda.org:74DUi4Ye579gUqzH4ziL9IyiJBlDpMRn9MBN8oNan9M= nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs=

      - name: Set up the Nix binary cache
        uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
        with:
          use-gha-cache: "enabled"
          use-flakehub: "disabled"
          diagnostic-endpoint: ""

      - name: Build ops (${{ matrix.cuda }})
        run: nix build .#ops-${{ matrix.cuda }} --print-build-logs

      - name: Stage libraries + manifest
        run: |
          set -euo pipefail
          PKGVER="$(cat VERSION)"
          DEST="ops/${PKGVER}/${{ matrix.cuda }}"
          mkdir -p "$DEST"
          cp result/*.so "$DEST/"
          python3 - "$DEST" <<'PY'
          import hashlib, json, pathlib, sys
          d = pathlib.Path(sys.argv[1])
          manifest = {}
          for so in sorted(d.glob("*.so")):
              blob = so.read_bytes()
              manifest[so.stem] = {
                  "file": so.name,
                  "sha256": hashlib.sha256(blob).hexdigest(),
                  "size": len(blob),
              }
          if not manifest:
              raise SystemExit("no .so files staged")
          (d / "manifest.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n"
          )
          PY

      - name: Upload ops artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ops-${{ matrix.cuda }}
          path: ops/**
          if-no-files-found: error

  build-wheels:
    name: Build wheel (${{ matrix.cuda }})
    needs: [build-ops]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cuda: [cu126, cu128, cu129, cu130, cu132, cu134]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Download ops artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ops-${{ matrix.cuda }}
          path: ops-staging

      - name: Build wheel (${{ matrix.cuda }})
        run: |
          set -euo pipefail
          mkdir -p sources/deformops/core/_ext
          find ops-staging -name "*.so" -exec cp {} sources/deformops/core/_ext/ \;
          if [ -z "$(ls -A sources/deformops/core/_ext/*.so 2>/dev/null)" ]; then
            echo "::error::No .so files found in ops-${{ matrix.cuda }} artifact"
            exit 1
          fi
          cuda_raw="${{ matrix.cuda }}"
          cuda_ver="${cuda_raw#cu}"
          cuda_ver="$(echo "$cuda_ver" | sed 's/^\(..\)/\1./')"
          DEFORMOPS_WHEEL_PLATLIB=1 CUDA_VERSION="$cuda_ver" uv run --with setuptools --with wheel python setup.py bdist_wheel

      - name: Collect wheel
        run: |
          mkdir -p dist
          ls -la dist/*.whl

      - name: Upload wheel artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: whl-${{ matrix.cuda }}
          path: dist/*.whl
          if-no-files-found: error

  publish-pages:
    name: Assemble + deploy Pages index
    needs: [build-ops, build-wheels]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Merge every ops-* artifact into public/ (they carry the ops/ prefix).
      - name: Download ops artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: ops-*
          path: public
          merge-multiple: true

      # Keep wheel artifacts separate (whl-<cuXXX>/) so the assembler can map
      # each wheel to its CUDA index.
      - name: Download wheel artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: whl-*
          path: wheel-staging

      - name: Attach wheels to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v$(cat VERSION)"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" wheel-staging/*/*.whl --clobber
          fi

      - name: Assemble ops + PEP 503 wheel index
        run: python3 .github/scripts/build_pages_index.py public wheel-staging

      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
